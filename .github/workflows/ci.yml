name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the integration snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Set up Python for reference contract tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10.22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install replay codec tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install reference contract test dependencies
        run: python -m pip install --disable-pip-version-check './policies[test]'

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Test reference contracts and process boundaries
        run: PYTHONPATH=policies python -m unittest discover -s policies/tests -p 'test_*.py' -v

      - name: Build UI
        run: bun run build:ui
