[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gameharness-policy"
version = "0.1.0"
description = "Finite original STEVE-1 reference protocol; inference requires a separately frozen runtime image"
requires-python = "==3.10.22"
dependencies = []

[project.optional-dependencies]
test = ["numpy==1.23.5"]

[project.scripts]
gameharness-reference-process = "gameharness_policy.reference_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gameharness_policy*"]
namespaces = true
