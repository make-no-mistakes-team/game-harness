plugins { id 'fabric-loom' version '1.9.2' }

version = '1.0'
group = 'io.gameharness'

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
}
loom {
    splitEnvironmentSourceSets()
    mods { survival_agent { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }

dependencies {
    testImplementation sourceSets.client.output
    testImplementation 'net.fabricmc:fabric-loader-junit:0.16.10'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform()
    // Load the named vanilla classes through Fabric's test launcher, not bare Java.
    classpath += sourceSets.client.runtimeClasspath
    // Fabric discovers mods and opens its logs relative to the test working directory.
    def testGameDir = layout.buildDirectory.dir('vanilla-test-run').get().asFile
    workingDir testGameDir
    doFirst { testGameDir.mkdirs() }
}

def dryRouteGraphProof = tasks.register('dryRouteGraphProof', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone observed dry-route graph behavior proofs.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.gameharness.survival.DryRouteGraphProof'
}
tasks.named('check') { dependsOn dryRouteGraphProof }
