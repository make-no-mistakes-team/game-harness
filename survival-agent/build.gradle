plugins { id 'fabric-loom' version '1.9.2' }

version = '1.0'
group = 'io.gameharness'

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
}
loom {
    splitEnvironmentSourceSets()
    mods { survival_agent { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }

dependencies { testImplementation sourceSets.client.output }
def dryRouteGraphProof = tasks.register('dryRouteGraphProof', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone observed dry-route graph behavior proofs.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.gameharness.survival.DryRouteGraphProof'
}
tasks.named('check') { dependsOn dryRouteGraphProof }
